server:
  port: ${APP_PORT:3773}
logging:
  file:
    name: /Users/mateusznowak/GitRepos/MateuszNaKodach/Heroes.Axon4to5.DCB/logs/heroes-axon5.log
  level:
    org.axonframework.messaging.tracing: INFO
    io.axoniq.framework.tracing: INFO
spring:
  application:
    name: heroesofddd-axon5
  profiles:
    group:
      observability-elastic: observability
      observability-jaeger: observability
  ai:
    mcp:
      server:
        enabled: true
        name: "Heroes of Might & Magic III - DDD/Event Sourcing Server"
        version: "1.0.0"
        instructions: "MCP server for Heroes of Might & Magic III domain built with DDD, Event Sourcing, and Axon Framework. Provides domain operations, game management tools, and educational DDD resources."
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:6446}/heroes_of_ddd_development
    username: heroes_of_ddd_db_user
    password: heroes_of_ddd_db_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
axon:
  axonserver:
    enabled: false
    # Host gRPC port mirrors compose's ${AXONSERVER_GRPC_PORT:-8124} (devports). Spring
    # placeholder syntax uses a single colon for the default. No-op while enabled=false.
    servers: localhost:${AXONSERVER_GRPC_PORT:8124}
      #  eventhandling:
      #    processors:
    # (Optional) You can override processor settings here if needed
    #  eventstore:
    # No need to specify storage-engine if axon-server is disabled and JPA is on classpath
    # Axon will auto-configure JpaEventStorageEngine
  converter:
    general: jackson
    events: jackson
    messages: jackson
  eventhandling:
    processors:
      Automation_WhenCreatureRecruitedThenAddToArmy_Processor:
        mode: pooled
        dlq:
          enabled: true
      Automation_WhenWeekStartedThenProclaimWeekSymbol_Processor:
        mode: pooled
        dlq:
          enabled: true
      Automation_WhenWeekSymbolProclaimedThenIncreaseDwellingAvailableCreatures_Processor:
        mode: pooled
        dlq:
          enabled: true
      ReadModel_Dwelling:
        mode: pooled
        initial-segment-count: 1
        batch-size: 5
      Read_GetAllDwellings_QueryCache:
        mode: subscribing
  tracing:
    # All Axon attribute providers stay at their defaults (true)
    show-event-sourcing-handlers: false
    event-processor:
      # Disable the StreamingEventProcessor.batch root span. Each event handler becomes
      # its own root trace with an OpenTelemetry LINK back to the publish-event span —
      # so Jaeger / Kibana APM render clickable "linked traces" for the cause/effect pair
      # across async boundaries. Off by default in Axon (batch trace = no links).
      disable-batch-trace: true
      distributed-in-same-trace: true
#  update-check:
#    disabled: true
application:
  eventstore:
    # dcb = Axon Server default (Dynamic Consistency Boundary) | aggregate-based = legacy aggregate engine.
    # Only takes effect when axon.axonserver.enabled=true (no-op with the JPA event store below).
    mode: aggregate-based
  maintenance:
    enabled: true
  interceptors:
    paid-commands:
      enabled: false

management:
  tracing:
    enabled: false       # turned on by the 'observability' Spring profile

# JDBC/SQL tracing (datasource-micrometer). Off by default so normal runs are unaffected;
# turned on by the 'observability' profile (see application-observability.yaml).
# NOTE: this property only has any effect when the app is built with -Dtracing.database.enabled=true
# (the 'tracing-database' Maven profile) — otherwise the datasource-micrometer JAR is not on the classpath
# and this key is simply ignored. See docs/OBSERVABILITY.md.
jdbc:
  datasource-proxy:
    enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none

axoniq:
  console:
    application-name: HeroesOfDDD-Axon4
    credentials: XYZ
    dlq-mode: FULL