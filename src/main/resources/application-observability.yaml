management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      transport: http

# Restore ThreadLocals (the current Micrometer observation/span) from the Reactor Context around
# operator execution — Boot's default is 'limited', which never installs
# Hooks.enableAutomaticContextPropagation(), so the WebFlux server span (living only in the Reactor
# Context) is invisible to the Axon span factory at dispatch time and every CommandBus/QueryBus
# span starts its own trace instead of joining the HTTP trace.
spring:
  reactor:
    context-propagation: auto

# JDBC/SQL tracing: wrap the HikariCP DataSource so every SQL statement (Axon JPA event store
# + read-model projections) becomes a child span under the Axon/HTTP spans.
# Parentless background JDBC observations (pooled event-processor token-store claims, pool warm-up)
# are filtered out by JdbcBackgroundConnectionTracingFilterConfiguration's ObservationPredicate,
# not by dropping the CONNECTION observation type, so in-request connection/query/result-set spans
# still nest correctly.
jdbc:
  datasource-proxy:
    enabled: true
    include-parameter-values: true   # bind parameter values in span attributes
