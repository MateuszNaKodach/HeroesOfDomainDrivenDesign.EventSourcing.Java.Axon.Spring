# Baked in at build time from the active Maven profile.
probe.variant=@probe.variant@
probe.workaround.enabled=@probe.workaround.enabled@
# handler | dispatcher, always passed by run-matrix.sh
probe.role=handler

spring.main.banner-mode=off
spring.main.web-application-type=none

axon.axonserver.enabled=true
axon.axonserver.servers=localhost:8124
axon.axonserver.context=default
axon.converter.general=jackson
axon.converter.messages=jackson
axon.converter.events=jackson

logging.level.root=WARN
logging.level.io.axoniq=INFO
