services:
  jaeger:
    image: jaegertracing/jaeger:2.5.0
    environment:
      - LOG_LEVEL=info
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"          # Jaeger UI
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"     # OTLP gRPC
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"     # OTLP HTTP (used by the app)
